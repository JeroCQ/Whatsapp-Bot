[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-independent-crm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "sqlalchemy==2.0.43", "alembic==1.16.5", "psycopg[binary]==3.2.10",
  "httpx==0.28.1", "PyJWT==2.10.1", "pywebpush==2.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12", "mypy==1.17.1", "types-PyJWT==1.7.1"]

[tool.setuptools.packages.find]
include = ["crm_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["crm_service"]
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = true
