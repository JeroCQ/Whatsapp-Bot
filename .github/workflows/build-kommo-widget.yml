name: Build Kommo widget

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
      - "codex/**"
    paths:
      - "kommo_widget/**"
      - ".github/workflows/build-kommo-widget.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate widget ZIP
        run: ./kommo_widget/build.sh

      # Upload the widget files themselves, not the already-built ZIP. GitHub
      # packages artifacts as ZIP files, so uploading the ZIP here would create
      # a confusing ZIP-inside-a-ZIP that Kommo rejects (manifest not at root).
      - name: Upload installable Kommo widget
        uses: actions/upload-artifact@v4
        with:
          name: kommo-salesbot-widget
          path: |
            kommo_widget/manifest.json
            kommo_widget/script.js
            kommo_widget/i18n/es.json
            kommo_widget/images
          if-no-files-found: error
          retention-days: 30
