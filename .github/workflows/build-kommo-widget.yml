name: Build Kommo widget

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
      - "codex/**"
    paths:
      - "kommo_widget/**"
      - ".github/workflows/build-kommo-widget.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate widget ZIP
        run: ./kommo_widget/build.sh

      - name: Upload installable Kommo widget
        uses: actions/upload-artifact@v4
        with:
          name: kommo-salesbot-widget
          path: dist/kommo-salesbot-widget.zip
          if-no-files-found: error
          retention-days: 30
